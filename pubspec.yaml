name: project_m
description: "Personal finance & expense tracker for students and young adults."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # Backend & Auth
  supabase_flutter: ^2.9.0
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Routing
  go_router: ^14.8.1
  
  # Charts & Visualization
  fl_chart: ^0.70.2
  
  # UI & Design
  google_fonts: ^6.2.1
  
  # Utilities
  intl: ^0.19.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
